name: Download market data

on:
  workflow_dispatch:   # run by hand for now; a daily schedule comes with incremental updates

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check which data sources answer
        run: |
          mkdir -p data
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for u in \
            "https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv" \
            "https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz" \
            "https://api.upstox.com/v3/historical-candle/NSE_EQ%7CINE002A01018/days/1/2024-12-31/2024-01-01" \
            "https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=1mo&interval=1d"; do
            echo "$(curl -s -m 20 -A "$UA" -o /dev/null -w '%{http_code}' "$u") $u"
          done | tee data/_probe.txt
      - name: Download from Upstox
        timeout-minutes: 60
        continue-on-error: true
        run: python -c "from algo.data import download_all; download_all(source='upstox')" 2>&1 | tee data/_log_upstox.txt
      - name: Download from Yahoo
        timeout-minutes: 75
        continue-on-error: true
        run: python -c "from algo.data import download_all; download_all(source='yahoo', sleep=0.3)" 2>&1 | tee data/_log_yahoo.txt
      - name: Commit data
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update market data $(date -u +%F)"
          git push
